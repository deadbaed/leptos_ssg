name: Playwright Tests for example site
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  playwright:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
    - name: Get Nixpkgs path
      run: |
        nixpkgs_path=$(nix eval --raw -f npins/default.nix nixpkgs)
        echo "NIX_PATH=nixpkgs=$nixpkgs_path" >> "$GITHUB_ENV"
    - run: nix-shell --run "cd example && cargo run"
    - run: nix-shell --arg release false --run "cd example && cp-tailwind-leptos_ssg target/example-site/style.css"
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - run: npm ci
    - run: npx playwright install --with-deps
    - run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
